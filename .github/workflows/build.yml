name: Build and check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download build tools
        shell: pwsh
        run: ./setup-tools.ps1
      - name: Check ringtone and updater boundaries
        shell: pwsh
        run: ./tests/run-tests.ps1
      - name: Build development APK and device test fixtures
        shell: pwsh
        run: |
          ./build.ps1
          ./tests/build-tests.ps1
          ./tests/build-updater-device-tests.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: development-apks
          path: |
            build/sim-ringtones.apk
            build/tests/tests.apk
          retention-days: 7
